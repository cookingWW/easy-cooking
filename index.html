<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">

<title>Что приготовить?</title>
<style>
:root{--bg:#fff;--ink:#222;--mut:#6b7280;--btn:#2563eb;--btn2:#1d4ed8;--soft:#eff4ff;--line:#e5e7eb;--ok:#16a34a;--no:#dc2626;--card:#fff;--chipc:#1d4ed8;--chipb:#c7d7fe;--inbg:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Trebuchet MS","Segoe UI",system-ui,sans-serif}
.deco{position:fixed;top:0;left:0;width:100%;height:100lvh;pointer-events:none;z-index:0;overflow:hidden}
.deco span{position:absolute;font-size:34px;opacity:.5}
main{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:28px;margin:8px 0 4px;text-align:center}
.sub{text-align:center;color:var(--mut);margin:0 0 18px}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--ink);-webkit-text-fill-color:var(--ink);caret-color:var(--btn);padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--inbg)}
input:focus{outline:none;border-color:var(--btn)}
button{font:inherit;cursor:pointer}
.btn{background:var(--btn);color:#fff;border:0;border-radius:12px;padding:12px 18px;font-weight:600}
.btn:hover{background:var(--btn2)}
.btn:focus-visible,.q:focus-visible,.chip:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}
.btn.ghost{background:var(--soft);color:var(--btn)}
.q,.chip{color:var(--ink);border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:14px}
.chip{background:var(--soft);border-color:var(--chipb);color:var(--chipc)}
.wrap{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.hint{color:var(--mut);font-size:14px;margin:6px 0}
h2{font-size:19px;margin:26px 0 10px}
.card{border:1px solid var(--line);border-radius:16px;background:var(--card);margin:10px 0;padding:14px 16px;box-shadow:0 1px 6px rgba(37,99,235,.07)}
.top{display:flex;gap:12px;align-items:center}
.em{font-size:34px}
.top b{display:block;font-size:17px}
.meta{color:var(--mut);font-size:14px}
.buy{margin-top:8px;background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:6px 10px;font-size:14px;color:#7c2d12}
.det{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.det h4{margin:10px 0 4px}
.det ul,.det ol{margin:0;padding-left:22px}
.ok{color:var(--ok)}.no{color:var(--no);font-weight:600}
.t{background:#fef3c7;color:#222;border-radius:6px;padding:0 5px;font-weight:600}
.stick{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding:8px 0}.heart{background:none;border:0;font-size:26px;color:#e11d48;padding:0 6px}.nu{width:100%;border-collapse:collapse;font-size:14px;text-align:center}.nu th,.nu td{padding:5px 4px;border-bottom:1px solid var(--line)}.nu td:first-child{text-align:left}.cnt{margin-top:8px;font-size:14px;font-weight:600;color:var(--chipc)}.cnt.full{color:var(--ok)}.tog{margin:12px 0 4px}
@media(prefers-reduced-motion:no-preference){.card{transition:box-shadow .2s}.card:hover{box-shadow:0 3px 12px rgba(37,99,235,.15)}}

html[data-theme=night]{--bg:#14161f;--card:#1e2130;--ink:#f1f5f9;--mut:#9ca3af;--btn:#3b82f6;--btn2:#2563eb;--soft:#232a45;--line:#343a4d;--chipc:#bfd3ff;--chipb:#3a4a85;--inbg:#1b1e2b;color-scheme:dark}
html[data-theme=fresh]{--bg:#f0fdf4;--card:#fff;--btn:#16a34a;--btn2:#15803d;--soft:#dcfce7;--line:#bbf7d0;--chipc:#166534;--chipb:#86efac}
.bar{display:flex;justify-content:flex-end;gap:8px}.sm{padding:6px 12px;font-size:14px}
.arrow{display:flex;align-items:center;justify-content:center;gap:8px}.arr{display:block}.tog{width:100%}.top>.arrow{padding:10px 14px}
.open .arr,.arrow.open .arr{transform:rotate(180deg)}
body,.card,input{transition:background-color .3s,color .3s}.arr{transition:transform .25s}

.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.logo img{display:block;border-radius:14px;filter:drop-shadow(0 4px 8px rgba(37,99,235,.28))}.logo svg{display:block;filter:drop-shadow(0 4px 8px rgba(37,99,235,.28))}
.lw{font-size:30px;line-height:1;font-weight:800;letter-spacing:.5px;font-family:Georgia,"Trebuchet MS",serif;font-style:italic;background:linear-gradient(135deg,var(--btn),#f472b6);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.ls{display:block;font:600 10px/1 "Trebuchet MS",sans-serif;letter-spacing:2.5px;text-transform:uppercase;color:var(--mut);margin-top:5px;-webkit-text-fill-color:var(--mut)}
.calc{margin:16px 0}
.calc summary{cursor:pointer;font-weight:700;font-size:17px;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px}
.calc summary::-webkit-details-marker{display:none}
.calc summary .arr{transition:transform .25s}
.calc[open] summary .arr{transform:rotate(180deg)}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.cg label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut);min-width:0}
.cg .w2{grid-column:1/-1}
select{font:inherit;font-size:16px;color:var(--ink);background:var(--inbg);padding:12px 10px;border:2px solid var(--line);border-radius:12px;width:100%;min-width:0}
select:focus{outline:none;border-color:var(--btn)}
.cr{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
.big{font-size:30px;font-weight:800;color:var(--btn)}
.bars{display:flex;height:12px;border-radius:99px;overflow:hidden;margin:10px 0 8px;gap:2px}
.bars i{display:block;height:100%}
.ml{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:15px}
.dot{width:10px;height:10px;border-radius:50%}
.ml b{text-align:right}
.pc{margin-top:6px;font-size:13px;color:var(--chipc);background:var(--soft);border-radius:8px;padding:4px 10px;display:inline-block}
.err{color:var(--no);font-size:14px;margin-top:8px}
@media(max-width:380px){.lw{font-size:25px}.logo svg{width:40px;height:40px}}
.hd .bar{flex-wrap:nowrap;gap:6px;margin-left:auto}
.hd .bar .btn{padding:4px 10px;font-size:13px;line-height:1.3;border-radius:999px;white-space:nowrap}
.hd .bar #th{font-size:15px;padding:3px 9px}
.vb{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.vb .btn{padding:14px 8px;font-size:16px;line-height:1.25}
.vb .btn small{display:block;font-weight:500;font-size:12px;opacity:.85}
.btn.tog.big2{padding:18px 14px;font-size:18px;margin-top:10px}
.btn.on{background:var(--btn);color:#fff}
.how ol{margin:12px 0 0;padding-left:22px}.how li{margin:0 0 8px;font-size:15px}
.how{border:0;box-shadow:none;background:none;padding:0;margin:28px 0 0;text-align:center}
.how:hover{box-shadow:none}
.how summary{display:block;font-weight:400;font-size:15px;text-decoration:underline;color:var(--mut)}
.how #how_b,.how #off_b{text-align:left;margin-top:8px;padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:var(--card)}
.how #how_b ol,.how #off_b ol{margin-top:0}.how #off_b p{margin:0 0 8px;font-size:15px}
#msg{display:none}
.lnk{background:none;border:0;padding:4px 8px;font-size:15px;color:var(--mut);text-decoration:underline}
#ov[hidden]{display:none}
#ov{position:fixed;left:0;top:0;width:100%;height:100%;z-index:100;background:var(--bg);color:var(--ink);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 30px)}
.ovb{position:sticky;top:0;z-index:2;display:inline-block;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:8px 18px;font-weight:700;font-size:15px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.ovc{max-width:640px;margin:10px auto 0}
.ovc h2{font-size:30px;font-weight:900;text-transform:uppercase;letter-spacing:.5px;margin:10px 0 16px;line-height:1.15}
.ovc ol{margin:0;padding-left:26px}.ovc li{margin:0 0 12px;font-size:17px;line-height:1.5}
.deco{display:block!important;background-color:var(--bg)}
html{background:var(--bg)}main{color:var(--ink)}
html,body,main,.card,.det{text-align:left}
.sep{border:0;border-top:2px solid var(--line);margin:6px 0 2px;display:none}
#up{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:40;width:50px;height:50px;border-radius:50%;border:0;background:var(--btn);color:#fff;display:none;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.25);padding:0}
#up.on{display:flex}body.ovo #up{display:none!important}#up:hover{background:var(--btn2)}

.ovl[hidden]{display:none}
.ovl{position:fixed;left:0;top:0;width:100%;height:100%;z-index:100;background:var(--bg);color:var(--ink);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 30px)}
#pk{z-index:110}
.plb{width:100%;margin-top:12px}
.pbar{height:12px;border-radius:99px;background:var(--soft);overflow:hidden;margin:8px 0}
.pbar i{display:block;height:100%;border-radius:99px;transition:width .3s}
.pit{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.pit .meta{display:block}
.pq{display:flex;gap:6px;flex:none}
.pq button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:18px;padding:0}
.pm h3{font-size:18px}
.tg{display:inline-block;margin-left:6px;font-size:11px;padding:1px 8px;border-radius:99px;background:var(--soft);color:var(--chipc);vertical-align:middle}
#pl .row .btn{flex:1}
#pk_q{width:100%;margin:6px 0 10px}
html[data-theme="sweet"] .deco{background-image:url("img/wallpaper-sweet.svg")}
html[data-theme="night"] .deco{background-image:url("img/wallpaper-night.svg")}
html[data-theme="fresh"] .deco{background-image:url("img/wallpaper-fresh.svg")}
.deco{background-repeat:repeat;background-size:360px 360px}
.hero{display:block;margin:0 auto 6px;max-width:420px;width:100%}
.em,.deco span{font-family:"Trebuchet MS","Segoe UI","Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",system-ui,sans-serif}
.em{font-size:28px;line-height:1;margin-right:2px}
</style></head><body>
<div class="deco" id="deco" aria-hidden="true"></div>
<main>
<header class="hd"><a class="logo" href="#" aria-label="Готовка" onclick="return false"><img src="img/logo.svg" width="46" height="46" alt="Готовка"><span><span class="lw" id="lw">Готовка</span><span class="ls" id="ls">вкусно и в норму</span></span></a><div class="bar"><button class="btn ghost sm" id="th"></button><button class="btn ghost sm" id="lg"></button></div></header><h1 id="h1"></h1>
<p class="sub" id="sub"></p>
<div class="stick"><div class="row"><input id="in" placeholder="Например: яйца, молоко, мука" autocomplete="off" aria-label="Продукт"><button class="btn" id="add">Добавить</button></div></div>
<div class="wrap" id="quick"></div>
<hr class="sep" id="sep">
<div class="hint" id="msg">Количество писать не нужно, можно через запятую. Соль, перец и воду вводить не нужно.</div>
<div class="wrap" id="chips"></div>
<details class="card calc" id="calc"><summary><span id="c_t"></span><svg class="arr" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></summary>
<div class="cg"><label><span id="c_sx"></span><select id="c_sex"></select></label><label><span id="c_ag"></span><input id="c_age" type="number" inputmode="numeric" min="18" max="100"></label>
<label><span id="c_wl"></span><input id="c_w" type="number" inputmode="decimal" min="30" max="300"></label><label><span id="c_hl"></span><input id="c_h" type="number" inputmode="numeric" min="120" max="230"></label>
<label class="w2"><span id="c_acl"></span><select id="c_act"></select></label><label class="w2"><span id="c_gl"></span><select id="c_goal"></select></label></div>
<div id="c_res"></div></details>
<div id="panel"></div><div class="vb"><button class="btn ghost" id="vq"></button><button class="btn ghost" id="vl"></button></div><button class="btn ghost tog arrow big2" id="all"></button>
<div id="sw" style="display:none;margin-top:14px"><input id="sr" style="width:100%" placeholder="Найти блюдо или продукт" aria-label="Поиск рецептов" autocomplete="off"></div>
<div id="out"></div>
<p class="how"><button class="lnk" id="how_t"></button></p>
<div id="pl" class="ovl" hidden><button class="ovb" id="pl_b"></button><div class="ovc" id="pl_c"></div></div>
<div id="pk" class="ovl" hidden><button class="ovb" id="pk_b"></button><div class="ovc"><h2 id="pk_h"></h2><input id="pk_q" type="text" autocomplete="off"><div id="pk_l"></div></div></div>
<div id="ov" hidden><button class="ovb" id="ov_b"></button><div class="ovc"><h2 id="ov_h"></h2><div id="how_b"></div></div></div>
</main>
<button id="up" aria-label="Наверх" title="Наверх"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button>
<script>
const IG=["соль", "перец", "вода", "хмели-сунели", "кориандр", "шафран", "винный уксус", "чили", "корица", "сода", "разрыхлитель", "острый перец", "паприка", "ваниль", "гвоздика", "лавровый лист", "мускатный орех", "розмарин", "тимьян", "шалфей", "эстрагон", "имбирь", "горчица", "острый соус"];
const K=s=>s.toLowerCase().replace(/ё/g,'е').trim().split(/\s+/).pop().slice(0,3);
const R=[
["\u{1F373}","Омлет",10,"Яйца:3 шт|Молоко:80 мл|Сливочное масло:10 г|Соль:щепотка|Перец:щепотка","Взбей яйца с молоком, солью и перцем.|Растопи масло на сковороде на среднем огне.|Влей смесь, накрой крышкой и готовь 4–5 мин."],
["\u{1F345}","Яичница с помидорами",10,"Яйца:3 шт|Помидоры:2 шт|Растительное масло:1 ст.л.|Соль:щепотка|Перец:щепотка","Нарежь помидоры кубиками и туши на масле 3 мин.|Вбей яйца, посоли и поперчи.|Жарь под крышкой 3–4 мин на среднем огне."],
["\u{1F95E}","Блины",30,"Яйца:2 шт|Молоко:500 мл|Мука:200 г|Сахар:20 г|Растительное масло:2 ст.л.|Соль:щепотка","Взбей яйца с сахаром и солью.|Влей молоко, всыпь муку, размешай без комков, добавь масло.|Жарь на горячей сковороде по 1–2 мин с каждой стороны."],
["\u{1F34C}","Банановые панкейки",20,"Бананы:2 шт|Яйца:2 шт|Мука:100 г|Растительное масло:1 ст.л.","Разомни бананы вилкой.|Добавь яйца и муку, перемешай в густое тесто.|Жарь небольшими порциями по 2 мин с каждой стороны на масле."],
["\u{1F9C0}","Сырники",30,"Творог:400 г|Яйца:1 шт|Мука:4 ст.л.|Сахар:2 ст.л.|Растительное масло:2 ст.л.|Соль:щепотка","Смешай творог, яйцо, сахар, соль и 2 ст.л. муки.|Слепи шайбочки и обваляй в оставшейся муке.|Жарь на масле по 3 мин с каждой стороны на среднем огне."],
["\u{1F963}","Овсянка с бананом",10,"Овсяные хлопья:60 г|Молоко:250 мл|Бананы:1 шт|Сахар:1 ч.л.","Вскипяти молоко.|Всыпь хлопья, вари 5 мин, помешивая.|Добавь сахар, сверху выложи кружочки банана."],
["\u{1F35E}","Гренки с сыром",15,"Хлеб:4 ломтика|Яйца:2 шт|Молоко:100 мл|Сыр:60 г|Растительное масло:2 ст.л.|Соль:щепотка","Взбей яйца с молоком и солью.|Обмакни хлеб с двух сторон.|Жарь по 2 мин с каждой стороны, посыпь тёртым сыром, накрой крышкой на 1 мин."],
["\u{1F96A}","Горячие бутерброды",15,"Хлеб:4 ломтика|Колбаса:100 г|Сыр:80 г|Помидоры:1 шт","Разложи хлеб на противне.|Сверху колбасу, кружочки помидора и тёртый сыр.|Выпекай при 200°C 8 мин до золотистого сыра."],
["\u{1F35D}","Макароны с сыром",20,"Макароны:200 г|Сыр:80 г|Сливочное масло:15 г|Соль:1 ч.л.|Перец:щепотка","Свари макароны в подсоленной воде 8–10 мин.|Слей воду, добавь масло.|Посыпь тёртым сыром и перцем, перемешай."],
["\u{1F35D}","Макароны по-флотски",30,"Макароны:250 г|Фарш:300 г|Лук:1 шт|Растительное масло:2 ст.л.|Соль:1 ч.л.|Перец:щепотка","Свари макароны 8–10 мин.|Обжарь лук 3 мин, добавь фарш, соль и перец, жарь 12 мин.|Смешай с макаронами и прогрей 2 мин."],
["\u{1F35D}","Паста с курицей в сливках",35,"Макароны:200 г|Курица:300 г|Сливки:200 мл|Чеснок:2 зубчика|Растительное масло:1 ст.л.|Соль:1 ч.л.|Перец:щепотка","Свари макароны 8–10 мин.|Обжарь кубики курицы с чесноком 8 мин.|Влей сливки, туши 5 мин на слабом огне.|Смешай с пастой."],
["\u{1F35A}","Рис с курицей",45,"Рис:200 г|Курица:300 г|Лук:1 шт|Морковь:1 шт|Растительное масло:2 ст.л.|Соль:1 ч.л.|Перец:щепотка","Обжарь курицу кусочками 7 мин.|Добавь лук и морковь, жарь 5 мин.|Всыпь промытый рис, залей водой (400 мл), посоли.|Туши под крышкой 20 мин на слабом огне."],
["\u{1F954}","Жареная картошка",30,"Картофель:600 г|Лук:1 шт|Растительное масло:3 ст.л.|Соль:1 ч.л.|Перец:щепотка","Нарежь картофель соломкой, лук полукольцами.|Жарь картофель 15 мин на среднем огне.|Добавь лук, посоли, жарь ещё 7 мин."],

["\u{1F35E}","Хачапури по-имеретински",70,"Мука:400 г|Кефир:250 мл|Яйца:1 шт|Дрожжи:7 г|Сахар:1 ч.л.|Имеретинский сыр:300 г|Сливочное масло:30 г|Соль:щепотка","Смешай муку, кефир, дрожжи, сахар, соль и яйцо, замеси мягкое тесто и оставь на 40 мин.|Раздели на 2 части, в каждую заверни тёртый сыр и раскатай лепёшки толщиной 5 мм.|Выпекай на сухой сковороде по 4 мин с каждой стороны или при 220 °C 12 мин, смажь маслом."],
["\u{1F35E}","Хачапури по-аджарски",60,"Мука:400 г|Кефир:200 мл|Дрожжи:7 г|Сахар:1 ч.л.|Сулугуни:250 г|Имеретинский сыр:150 г|Яйца:3 шт|Сливочное масло:30 г|Соль:щепотка","Замеси тесто из муки, кефира, дрожжей, сахара и соли, оставь на 40 мин.|Раздели на 3 части, сформируй лодочки и выложи внутрь смесь тёртых сыров.|Выпекай при 230 °C 12 мин, вбей в каждую лодочку яйцо, верни на 3 мин и добавь масло."],
["\u{1F35E}","Хачапури по-мегрельски",65,"Мука:400 г|Кефир:250 мл|Дрожжи:7 г|Сахар:1 ч.л.|Имеретинский сыр:250 г|Сулугуни:250 г|Сливочное масло:30 г|Соль:щепотка","Замеси тесто из муки, кефира, дрожжей, сахара и соли, подними 40 мин.|Раскатай лепёшку, заверни внутрь имеретинский сыр и раскатай заново.|Выпеки при 220 °C 15 мин, посыпь тёртым сулугуни и верни в духовку на 5 мин."],
["\u{1F35E}","Хачапури пеновани",50,"Мука:350 г|Яйца:1 шт|Вода:150 мл|Сливочное масло:150 г|Имеретинский сыр:300 г|Соль:щепотка","Замеси тесто из муки, воды, яйца и соли, оставь на 20 мин.|Раскатай, смажь маслом, сложи в несколько слоёв и охлади 15 мин.|Раскатай, выложи сыр, сформируй конвертики и выпекай при 200 °C 20 мин."],
["\u{1F35E}","Гурули",70,"Мука:400 г|Кефир:250 мл|Дрожжи:7 г|Сахар:1 ч.л.|Имеретинский сыр:250 г|Яйца:3 шт|Соль:щепотка","Замеси тесто из муки, кефира, дрожжей, сахара и соли, подними 40 мин.|Сварь яйца вкрутую, порубь и смешай с тёртым сыром.|Раскатай полукруги, выложи начинку, защипни края и выпекай при 200 °C 25 мин."],

["\u{1F35E}","Ленивое хачапури на сковороде",25,"Мука:300 г|Кефир:250 мл|Сыр:250 г|Яйца:1 шт|Сода:0.5 ч.л.|Растительное масло:1 ст.л.|Соль:щепотка","Смешай кефир, яйцо, соду, соль и муку в мягкое тесто.|Раздели на 4 части, в каждую заверни тёртый сыр и раскатай.|Обжарь на сухой сковороде под крышкой по 4 мин с каждой стороны."],
["\u{1F35E}","Хачапури из лаваша",20,"Лаваш:2 лист|Сулугуни:250 г|Яйца:2 шт|Кефир:100 мл|Сливочное масло:20 г|Кинза:0.5 пучок","Смешай тёртый сулугуни, яйцо и рубленую кинзу.|Разрежь лаваш на квадраты, смажь смесью кефира и яйца, выложи сыр и сложи конвертом.|Обжарь на масле по 3 мин с каждой стороны."],
["\u{1F35E}","Хачапури с творогом",40,"Мука:300 г|Кефир:200 мл|Творог:250 г|Сыр:100 г|Яйца:1 шт|Сода:0.5 ч.л.|Соль:щепотка","Замеси тесто из муки, кефира, соды и соли.|Смешай творог с тёртым сыром и яйцом.|Раскатай лепёшки, заверни начинку и выпекай при 200 °C 20 мин."],

["\u{1F35E}","Мини-хачапури",45,"Мука:300 г|Кефир:150 мл|Сливочное масло:100 г|Сулугуни:250 г|Яйца:1 шт|Соль:щепотка","Замеси тесто из муки, мягкого масла, кефира и соли, охлади 20 мин.|Раскатай, вырежь кружки, на половину выложи тёртый сулугуни и накрой вторым кружком.|Смажь яйцом и выпекай при 190 °C 18 мин."],
["\u{1F35E}","Хачапури из слоёного теста",35,"Слоёное тесто:400 г|Имеретинский сыр:250 г|Яйца:2 шт|Кинза:0.5 пучок","Разморозь тесто, раскатай и нарежь квадраты.|Смешай сыр с яйцом и рубленой кинзой, выложи на квадраты и сложи углы конвертом.|Смажь яйцом и выпекай при 200 °C 20 мин."],
["\u{1F35E}","Ачма",80,"Мука:400 г|Яйца:2 шт|Вода:100 мл|Сулугуни:300 г|Имеретинский сыр:200 г|Сливочное масло:100 г|Мацони:200 г|Соль:щепотка","Замеси тесто из муки, яиц, воды и соли, раскатай тонкие пласты и проваривай по 1 мин.|Смешай тёртые сыры с мацони.|Выкладывай слоями пласты, смазанные маслом, и начинку, запекай при 200 °C 35 мин."],
["\u{1F967}","Кубдари",90,"Мука:400 г|Кефир:200 мл|Дрожжи:7 г|Говядина:300 г|Свинина:200 г|Лук:2 шт|Хмели-сунели:1 ч.л.|Кориандр:1 ч.л.|Соль:1 ч.л.","Замеси тесто из муки, кефира, дрожжей и соли, подними 40 мин.|Нарежь мясо мелкими кубиками, смешай с луком и специями.|Заверни начинку в круглые лепёшки, раскатай и выпекай при 200 °C 30 мин."],
["\u{1F35E}","Качмази",45,"Кукурузная мука:300 г|Вода:300 мл|Имеретинский сыр:250 г|Яйца:2 шт|Молоко:200 мл|Сливочное масло:50 г|Соль:щепотка","Свари из кукурузной муки, воды и молока густую кашу и остуди.|Смешай с тёртым сыром, яйцами и маслом.|Выложи в форму и запеки при 200 °C 25 мин."],
["\u{1F35E}","Мчади",30,"Кукурузная мука:300 г|Вода:250 мл|Растительное масло:2 ст.л.|Соль:щепотка","Замеси из муки, тёплой воды и соли густое тесто.|Сформируй небольшие лепёшки толщиной 1,5 см.|Обжарь на масле по 5 мин с каждой стороны до румяной корочки."],
["\u{1F35E}","Шотис пури",90,"Мука:500 г|Вода:300 мл|Дрожжи:7 г|Соль:1 ч.л.|Сахар:1 ч.л.","Замеси тесто из муки, воды, дрожжей, соли и сахара, подними 1 час.|Раздели на 2 части и сформируй длинные лодочки с заострёнными концами.|Выпекай при 250 °C 15 мин на горячем противне."],
["\u{1F35E}","Лобиани из лаваша",25,"Лаваш:2 лист|Фасоль:1 банка|Лук:1 шт|Кинза:0.5 пучок|Растительное масло:2 ст.л.|Соль:щепотка","Разомни фасоль с обжаренным луком и рубленой кинзой.|Разрежь лаваш пополам, выложи начинку и заверни конвертом.|Обжарь на масле по 3 мин с каждой стороны."],
["\u{1F35E}","Хачапури с сулугуни и яйцом",35,"Лаваш:2 лист|Сулугуни:250 г|Яйца:2 шт|Сливочное масло:20 г|Соль:щепотка","Выстели форму лавашем, выложи тёртый сулугуни.|Сделай в сыре две ямки и вбей яйца.|Запекай при 200 °C 15 мин, добавь кусочек масла."],
["\u{1F35E}","Хачапури-конверты",40,"Мука:300 г|Кефир:200 мл|Сыр:200 г|Яйца:1 шт|Ветчина:100 г|Сода:0.5 ч.л.|Соль:щепотка","Замеси тесто из муки, кефира, соды и соли.|Раскатай квадраты, выложи тёртый сыр и ветчину, сложи конвертом.|Смажь яйцом и выпекай при 200 °C 20 мин."],
["\u{1F35E}","Хачапури с картофелем",50,"Мука:300 г|Кефир:200 мл|Картофель:300 г|Сыр:150 г|Сливочное масло:20 г|Сода:0.5 ч.л.|Соль:щепотка","Свари картофель, разомни с маслом и тёртым сыром.|Замеси тесто из муки, кефира, соды и соли, раскатай лепёшки.|Заверни начинку и обжарь на сухой сковороде по 4 мин с каждой стороны."],
["\u{1F35E}","Сырные лепёшки на кефире",25,"Мука:300 г|Кефир:250 мл|Сулугуни:200 г|Сода:0.5 ч.л.|Растительное масло:1 ст.л.|Соль:щепотка","Замеси мягкое тесто из муки, кефира, соды и соли.|Раскатай лепёшки, выложи тёртый сулугуни и сложи пополам.|Обжарь на сухой сковороде по 3 мин с каждой стороны."],
["\u{1F35E}","Мчади с сыром",35,"Кукурузная мука:250 г|Вода:250 мл|Сулугуни:150 г|Растительное масло:2 ст.л.|Соль:щепотка","Замеси из кукурузной муки, воды и соли густое тесто.|Заверни в лепёшки тёртый сулугуни.|Обжарь на масле по 5 мин с каждой стороны."],
["\u{1F35E}","Кукурузный хлеб по-грузински",45,"Кукурузная мука:300 г|Мука:100 г|Кефир:250 мл|Яйца:1 шт|Растительное масло:3 ст.л.|Разрыхлитель:1 ч.л.|Соль:щепотка","Смешай муки, кефир, яйцо, масло, разрыхлитель и соль.|Вылей тесто в смазанную форму.|Выпекай при 190 °C 30 мин."],
["\u{1F967}","Пирог с фасолью и луком",60,"Мука:350 г|Кефир:200 мл|Фасоль:1 банка|Лук:2 шт|Растительное масло:3 ст.л.|Кинза:0.5 пучок|Сода:0.5 ч.л.|Соль:щепотка","Замеси тесто из муки, кефира, соды и соли.|Разомни фасоль и смешай с обжаренным луком и кинзой.|Заверни начинку в тесто, раскатай и выпеки при 200 °C 25 мин."],
["\u{1F95F}","Хинкали с говядиной и свининой",90,"Мука:500 г|Вода:250 мл|Говядина:300 г|Свинина:300 г|Лук:2 шт|Кинза:1 пучок|Хмели-сунели:1 ч.л.|Соль:1 ч.л.","Замеси крутое тесто из муки, воды и соли, оставь на 30 мин.|Пропусти мясо с луком, добавь рубленую кинзу, специи и немного холодной воды.|Раскатай кружки, выложи фарш, собери складками и вари 10–12 мин после всплытия."],
["\u{1F95F}","Хинкали с бараниной",90,"Мука:500 г|Вода:250 мл|Баранина:600 г|Лук:2 шт|Кинза:1 пучок|Кориандр:1 ч.л.|Соль:1 ч.л.","Замеси крутое тесто из муки, воды и соли, оставь на 30 мин.|Пропусти баранину с луком, добавь кинзу, кориандр и холодную воду.|Сформируй хинкали и вари 10–12 мин в кипящей подсоленной воде."],
["\u{1F95F}","Хинкали с сыром",60,"Мука:500 г|Вода:250 мл|Имеретинский сыр:300 г|Сулугуни:200 г|Яйца:1 шт|Соль:1 ч.л.","Замеси крутое тесто из муки, воды и соли, оставь на 30 мин.|Смешай тёртые сыры с яйцом.|Заверни начинку в кружки теста и вари 8–10 мин."],
["\u{1F95F}","Хинкали с картофелем",70,"Мука:500 г|Вода:250 мл|Картофель:500 г|Лук:1 шт|Сливочное масло:30 г|Кинза:0.5 пучок|Соль:1 ч.л.","Замеси крутое тесто из муки, воды и соли.|Свари картофель, разомни с маслом, жареным луком и кинзой.|Заверни начинку и вари хинкали 8–10 мин."],
["\u{1F95F}","Хинкали с грибами",70,"Мука:500 г|Вода:250 мл|Шампиньоны:400 г|Лук:1 шт|Растительное масло:2 ст.л.|Кинза:0.5 пучок|Соль:1 ч.л.","Замеси крутое тесто из муки, воды и соли.|Обжарь грибы с луком 10 мин, добавь рубленую кинзу.|Заверни начинку и вари хинкали 8–10 мин."],
["\u{1F95F}","Хинкали с зеленью",65,"Мука:500 г|Вода:250 мл|Кинза:2 пучок|Петрушка:1 пучок|Лук:1 шт|Сыр:100 г|Соль:1 ч.л.","Замеси крутое тесто из муки, воды и соли.|Мелко порубь зелень и лук, смешай с тёртым сыром.|Заверни начинку и вари хинкали 8–10 мин."],
["\u{1F95F}","Жареные хинкали",25,"Хинкали:12 шт|Сливочное масло:30 г|Лук:1 шт|Кинза:0.5 пучок","Подготовь сваренные хинкали.|Обжарь на масле с кольцами лука 6–7 мин до золотистой корочки.|Подай, посыпав рубленой кинзой."],
["\u{1F95F}","Хинкали с курицей",80,"Мука:500 г|Вода:250 мл|Курица:500 г|Лук:2 шт|Кинза:1 пучок|Хмели-сунели:1 ч.л.|Соль:1 ч.л.","Замеси крутое тесто из муки, воды и соли.|Пропусти курицу с луком, добавь кинзу, специи и холодную воду.|Заверни начинку в тесто и вари хинкали 10 мин."],
["\u{1F95F}","Ленивые хинкали",45,"Мука:300 г|Вода:150 мл|Фарш:400 г|Лук:1 шт|Кинза:1 пучок|Соль:1 ч.л.","Замеси тесто из муки, воды и соли, нарежь небольшие кусочки.|Смешай фарш с луком, кинзой и солью, слепи фрикадельки.|Свари всё вместе в подсоленной воде 12 мин."],
["\u{1F95F}","Хинкали с индейкой",80,"Мука:500 г|Вода:250 мл|Индейка:500 г|Лук:2 шт|Кинза:1 пучок|Соль:1 ч.л.","Замеси крутое тесто из муки, воды и соли.|Пропусти индейку с луком, добавь кинзу и холодную воду.|Заверни начинку и вари хинкали 10 мин."],
["\u{1F372}","Харчо из говядины",90,"Говядина:500 г|Рис:70 г|Лук:2 шт|Грецкие орехи:60 г|Ткемали:3 ст.л.|Чеснок:4 зубчика|Томатный соус:3 ст.л.|Кинза:1 пучок|Хмели-сунели:1 ч.л.|Соль:1 ч.л.","Залей говядину водой и вари 60 мин, сними пену.|Добавь рис, обжаренный лук, томатный соус и измельчённые орехи, вари 15 мин.|Заправь ткемали, чесноком, хмели-сунели и кинзой, дай настояться 10 мин."],
["\u{1F372}","Харчо из курицы",50,"Курица:600 г|Рис:70 г|Лук:2 шт|Грецкие орехи:50 г|Ткемали:3 ст.л.|Чеснок:3 зубчика|Кинза:1 пучок|Хмели-сунели:1 ч.л.|Соль:1 ч.л.","Свари курицу в воде 30 мин.|Добавь рис, обжаренный лук и толчёные орехи, вари 15 мин.|Заправь ткемали, чесноком, специями и кинзой."],
["\u{1F372}","Чихиртма",60,"Курица:700 г|Лук:2 шт|Яйца:3 шт|Мука:1 ст.л.|Винный уксус:2 ст.л.|Кинза:1 пучок|Сливочное масло:30 г|Шафран:щепотка|Соль:1 ч.л.","Свари курицу в воде 40 мин, разбери на куски.|Пассеруй лук с мукой на масле и влей в бульон.|Вмешай взбитые яйца с уксусом и ложкой бульона, влей тонкой струйкой, добавь кинзу."],
["\u{1F372}","Чанахи",120,"Баранина:600 г|Баклажаны:2 шт|Картофель:400 г|Помидоры:3 шт|Лук:2 шт|Чеснок:3 зубчика|Кинза:1 пучок|Соль:1 ч.л.","Нарежь мясо и овощи крупными кусками.|Выложи в горшочки слоями: мясо, лук, баклажаны, картофель, помидоры.|Добавь воду, чеснок и соль, туши при 180 °C 90 мин, посыпь кинзой."],
["\u{1F372}","Бозбаши",110,"Баранина:600 г|Нут:100 г|Картофель:300 г|Лук:2 шт|Алыча:100 г|Помидоры:2 шт|Кинза:1 пучок|Соль:1 ч.л.","Замочи нут на ночь, свари мясо в воде 60 мин.|Добавь нут, лук и вари ещё 30 мин.|Положи картофель, алычу и помидоры, вари 20 мин, посыпь кинзой."],
["\u{1F372}","Бозартма",90,"Баранина:700 г|Лук:3 шт|Алыча:150 г|Помидоры:2 шт|Чеснок:3 зубчика|Кинза:1 пучок|Растительное масло:2 ст.л.|Соль:1 ч.л.","Обжарь мясо на масле до корочки.|Добавь лук, помидоры, алычу и воду.|Туши под крышкой 60 мин, заправь чесноком и кинзой."],
["\u{1F372}","Суп пити",130,"Баранина:500 г|Нут:100 г|Картофель:300 г|Лук:1 шт|Алыча:80 г|Помидоры:1 шт|Мята:0.5 пучок|Соль:1 ч.л.","Замочи нут на ночь.|Выложи в горшочки мясо, нут, картофель, лук, алычу и помидор.|Залей водой, посоли и туши при 170 °C 100 мин, посыпь мятой."],
["\u{1F372}","Суп из красной фасоли",75,"Красная фасоль:200 г|Лук:1 шт|Морковь:1 шт|Картофель:200 г|Кинза:1 пучок|Чеснок:2 зубчика|Растительное масло:2 ст.л.|Соль:1 ч.л.","Замочи фасоль на ночь и свари 45 мин.|Добавь картофель, морковь и обжаренный лук, вари 20 мин.|Заправь чесноком и кинзой, часть фасоли разомни для густоты."],
["\u{1F372}","Грузинский суп из чечевицы",45,"Чечевица:200 г|Лук:1 шт|Морковь:1 шт|Картофель:200 г|Помидоры:2 шт|Кинза:1 пучок|Хмели-сунели:1 ч.л.|Растительное масло:2 ст.л.|Соль:1 ч.л.","Обжарь лук и морковь на масле 5 мин.|Добавь чечевицу, картофель, помидоры и воду, вари 25 мин.|Заправь специями, посоли и посыпь кинзой."],
["\u{1F372}","Суп с кинзой и орехами",40,"Курица:400 г|Грецкие орехи:80 г|Лук:1 шт|Чеснок:3 зубчика|Кинза:1 пучок|Рис:50 г|Соль:1 ч.л.","Свари курицу 25 мин, достань и разбери.|Добавь рис и вари 12 мин.|Влей пасту из орехов и чеснока, верни мясо, добавь кинзу."],
["\u{1F372}","Грибной суп по-грузински",40,"Шампиньоны:400 г|Лук:1 шт|Картофель:200 г|Грецкие орехи:40 г|Чеснок:2 зубчика|Кинза:0.5 пучок|Сливочное масло:20 г|Соль:1 ч.л.","Обжарь грибы с луком на масле 8 мин.|Добавь картофель, воду и вари 15 мин.|Заправь толчёными орехами, чесноком и кинзой."],
["\u{1F372}","Суп из зелёной фасоли",35,"Зелёная фасоль:400 г|Картофель:200 г|Лук:1 шт|Морковь:1 шт|Кинза:0.5 пучок|Чеснок:2 зубчика|Растительное масло:2 ст.л.|Соль:1 ч.л.","Обжарь лук и морковь 5 мин.|Добавь картофель, фасоль и воду, вари 20 мин.|Заправь чесноком и кинзой."],
["\u{1F372}","Грузинский суп с фрикадельками",50,"Фарш:400 г|Рис:50 г|Лук:2 шт|Картофель:300 г|Морковь:1 шт|Кинза:1 пучок|Яйца:1 шт|Соль:1 ч.л.","Смешай фарш с рисом, луком, яйцом и солью, слепи шарики.|Опусти в кипящую воду с картофелем и морковью.|Вари 25 мин, посыпь кинзой."],
["\u{1F372}","Холодный суп из мацони",15,"Мацони:500 г|Огурцы:2 шт|Чеснок:2 зубчика|Укроп:1 пучок|Мята:0.5 пучок|Грецкие орехи:30 г|Соль:щепотка","Нарежь огурцы кубиками.|Смешай мацони с чесноком, зеленью и солью.|Добавь огурцы и орехи, охлади."],
["\u{1F372}","Суп с алычой",50,"Курица:500 г|Алыча:150 г|Рис:50 г|Лук:1 шт|Чеснок:3 зубчика|Кинза:1 пучок|Соль:1 ч.л.","Свари курицу 30 мин.|Добавь рис, лук и вари 12 мин.|Положи алычу, чеснок и кинзу, вари ещё 5 мин."],
["\u{1F372}","Хаши",240,"Говяжьи ножки:1500 г|Чеснок:2 головка|Вода:3 л|Соль:2 ч.л.|Лаваш:2 лист","Замочи ножки на ночь, промой, залей водой.|Вари на слабом огне 4 часа до мягкости, снимай пену.|Подай горячим с толчёным чесноком и лавашем."],
["\u{1F372}","Суп из баклажанов",40,"Баклажаны:3 шт|Лук:1 шт|Помидоры:2 шт|Картофель:200 г|Чеснок:2 зубчика|Кинза:1 пучок|Растительное масло:2 ст.л.|Соль:1 ч.л.","Запеки баклажаны 20 мин при 200 °C и очисти.|Обжарь лук, добавь помидоры, картофель и воду, вари 15 мин.|Добавь мякоть баклажанов, чеснок и кинзу."],
["\u{1F372}","Овощной суп по-грузински",40,"Картофель:300 г|Морковь:1 шт|Кабачки:1 шт|Помидоры:2 шт|Лук:1 шт|Чеснок:2 зубчика|Кинза:1 пучок|Растительное масло:2 ст.л.|Соль:1 ч.л.","Обжарь лук и морковь на масле.|Добавь картофель, кабачок, помидоры и воду, вари 20 мин.|Заправь чесноком и кинзой."],
["\u{1F372}","Харчо из баранины",100,"Баранина:500 г|Рис:70 г|Лук:2 шт|Грецкие орехи:50 г|Ткемали:3 ст.л.|Чеснок:3 зубчика|Кинза:1 пучок|Хмели-сунели:1 ч.л.|Соль:1 ч.л.","Свари баранину 60 мин с лавровым листом.|Добавь рис, лук и орехи, вари 15 мин.|Заправь ткемали, чесноком и специями, добавь кинзу."],
["\u{1F372}","Суп из шпината с яйцом",25,"Шпинат:300 г|Яйца:2 шт|Картофель:200 г|Лук:1 шт|Чеснок:2 зубчика|Растительное масло:1 ст.л.|Соль:1 ч.л.","Обжарь лук, добавь картофель и воду, вари 12 мин.|Положи шпинат и вари 3 мин.|Вмешай взбитые яйца и чеснок, прогрей 1 мин."],
["\u{1F362}","Шашлык (мцвади) из свинины",60,"Свинина:1000 г|Лук:3 шт|Гранатовый сок:100 мл|Хмели-сунели:1 ч.л.|Соль:1 ч.л.|Перец:щепотка","Нарежь свинину крупными кусками, смешай с луком, гранатовым соком и специями на 2 часа.|Нанижи на шампуры.|Жарь над углями 15–20 мин, переворачивая."],
["\u{1F362}","Мцвади из баранины",60,"Баранина:1000 г|Лук:3 шт|Гранат:1 шт|Кинза:1 пучок|Соль:1 ч.л.|Перец:щепотка","Нарежь баранину кусками, смешай с луком, зёрнами граната и солью на 3 часа.|Нанижи на шампуры.|Жарь на углях 15–20 мин, посыпь кинзой."],
["\u{1F362}","Мцвади из говядины",60,"Говядина:1000 г|Лук:3 шт|Винный уксус:2 ст.л.|Хмели-сунели:1 ч.л.|Соль:1 ч.л.|Перец:щепотка","Нарежь говядину кусками, смешай с луком, уксусом и специями на 3 часа.|Нанижи на шампуры.|Жарь на углях 15–20 мин."],
["\u{1F362}","Мцвади из курицы",50,"Курица:1000 г|Лук:2 шт|Лимон:1 шт|Хмели-сунели:1 ч.л.|Чеснок:3 зубчика|Соль:1 ч.л.","Нарежь курицу кусками, смешай с луком, лимонным соком, чесноком и специями на 2 часа.|Нанижи на шампуры.|Жарь на углях 15–20 мин до румяной корочки."],
["\u{1F357}","Чахохбили из курицы",60,"Курица:1000 г|Помидоры:5 шт|Лук:3 шт|Чеснок:4 зубчика|Кинза:1 пучок|Базилик:0.5 пучок|Хмели-сунели:1 ч.л.|Сливочное масло:30 г|Соль:1 ч.л.","Обжарь куски курицы без масла 15 мин.|Добавь лук, натёртые помидоры и специи, туши 30 мин.|Положи чеснок, кинзу и базилик, прогрей 3 мин."],
["\u{1F357}","Чахохбили из индейки",60,"Индейка:800 г|Помидоры:5 шт|Лук:3 шт|Чеснок:3 зубчика|Кинза:1 пучок|Хмели-сунели:1 ч.л.|Растительное масло:2 ст.л.|Соль:1 ч.л.","Обжарь индейку на масле до золотистого цвета.|Добавь лук, помидоры, специи и туши 35 мин.|Заправь чесноком и кинзой."],
["\u{1F969}","Чакапули из баранины",90,"Баранина:800 г|Алыча:200 г|Тархун:2 пучок|Кинза:1 пучок|Лук:2 шт|Чеснок:3 зубчика|Сухое вино:150 мл|Соль:1 ч.л.","Обжарь баранину, добавь лук и вино.|Положи алычу, тархун и воду, туши под крышкой 60 мин.|Заправь чесноком и кинзой, дай настояться."],
["\u{1F969}","Чакапули из говядины",100,"Говядина:800 г|Ткемали:3 ст.л.|Тархун:2 пучок|Кинза:1 пучок|Лук:2 шт|Чеснок:3 зубчика|Соль:1 ч.л.","Обжарь говядину с луком до корочки.|Добавь ткемали, тархун и воду, туши 75 мин.|Заправь чесноком и кинзой."],

Object.assign(S.ru,{back:'← Назад',how_t:'Как использовать?',how_b:'<ol><li><b>Введи продукты</b>, которые есть дома: по одному или через запятую, количество писать не нужно. Соль, перец и воду добавлять не надо. Можно просто нажимать кнопки «+ продукт». Чтобы убрать продукт, нажми на него.</li><li><b>Смотри подборку.</b> «Можно готовить сейчас» — всё есть. «Не хватает одного продукта» — подскажу, что докупить. «Остальные» — блюда, где есть хотя бы один твой продукт. Выше стоят блюда, где совпадений больше.</li><li><b>Нажми стрелку у блюда</b>, чтобы увидеть ингредиенты с граммовкой, шаги, время, температуру и КБЖУ. Красным отмечено то, чего не хватает. У блюд из разных кухонь есть метка, например «Итальянская кухня».</li><li><b>Нажми ♡</b>, чтобы добавить блюдо в избранное: оно всегда будет сверху.</li><li><b>Кнопки «Быстрые», «Долгие» и «Все блюда»</b> открывают списки по времени готовки (граница 30 минут) и полный список. Внутри есть поиск по названию, продукту или кухне: напиши «французская», «итальянская», «американская», «русская» или «грузинская». Повторное нажатие на кнопку закрывает список.</li><li><b>2000 рецептов.</b> В приложении есть блюда грузинской, французской, итальянской, американской и русской кухонь, а также обычные домашние рецепты.</li><li><b>Дневная норма калорий.</b> Открой блок «Моя дневная норма калорий» и введи пол, возраст, вес, рост, активность и цель. Приложение покажет норму, а также как распределить её на завтрак, обед, перекус и ужин. Расчёт примерный и только для взрослых, это не медицинская рекомендация.</li><li><b>Рацион на день.</b> В этом же блоке нажми «Предложить рацион»: приложение само подберёт блюда на все приёмы пищи. Кнопка «Составить рацион на день» открывает экран рациона, где можно добавлять блюда через поиск, менять порции кнопками − и +, заменять блюдо на похожее кнопкой ↻, удалять его кнопкой ✕ и подбирать рацион заново. Сверху видно, сколько калорий набрано и сколько осталось.</li><li><b>Тема</b> меняет оформление, <b>EN / RU</b> переключает язык. Круглая кнопка со стрелкой вверх появляется при прокрутке и возвращает наверх.</li><li>Всё, что ты вводишь (продукты, избранное, данные для расчёта и рацион), сохраняется в приложении.</li></ol>',vq:'\u{26A1} Быстрые<small>до 30 мин</small>',vl:'\u{1F372} Долгие<small>от 30 мин</small>',qk:'\u{26A1} Быстрая готовка (до 30 мин)',lg:'\u{1F372} Долгая готовка (30 мин и больше)',logo:'Готовка',slogan:'вкусно и в норму',c_t:'\u{1F525} Моя дневная норма калорий',c_sx:'Пол',c_ag:'Возраст (лет)',c_wl:'Вес (кг)',c_hl:'Рост (см)',c_acl:'Активность',c_gl:'Цель',sx:['Женщина','Мужчина'],act:['Мало движения (сидячая работа)','Лёгкая (1–3 тренировки в неделю)','Средняя (3–5 тренировок)','Высокая (6–7 тренировок)'],goal:['Держать вес','Снижать вес мягко','Набирать вес'],c_fill:'Заполни пол, возраст, вес и рост, и я посчитаю норму.',c_age:'Расчёт только для взрослых (от 18 лет). Для подростков лучше спросить врача.',c_norm:'Твоя норма на день',c_kc:'ккал',c_how:'Как распределить',meals:['Завтрак','Обед','Перекус','Ужин'],c_mac:'Ориентир по БЖУ на день:',c_g:'г',c_note:'Это примерный расчёт (формула Миффлина — Сан-Жеора), а не медицинская рекомендация. При болезнях или особых диетах лучше обсудить питание с врачом.',c_low:'Норма не опускается ниже безопасного минимума.',c_dish:'всё блюдо — %1 ккал, это %2% дневной нормы'});
Object.assign(S.en,{back:'← Back',how_t:'How to use?',how_b:'<ol><li><b>Enter the products</b> you have at home, one by one or separated by commas; no amounts needed. Do not add salt, pepper or water. You can also tap the "+ product" buttons. Tap a product to remove it.</li><li><b>Check the suggestions.</b> "Ready to cook now" means you have everything. "One item missing" tells you what to buy. "Other dishes" contains dishes with at least one of your products. Dishes with more matches come first.</li><li><b>Tap the arrow on a dish</b> to see ingredients with amounts, steps, time, temperature and nutrition. Red marks what is missing. Dishes from different cuisines have a label, for example "Italian cuisine".</li><li><b>Tap ♡</b> to add a dish to favorites; it will always be at the top.</li><li><b>The \u{26A1} Quick, \u{1F372} Slow and \u{1F4D6} All dishes buttons</b> open lists by cooking time (30 minutes is the border) and the full list. There is a search by name, product or cuisine: type "french", "italian", "american", "russian" or "georgian". Tap the button again to close the list.</li><li><b>2000 recipes.</b> The app has Georgian, French, Italian, American and Russian dishes, as well as everyday home recipes.</li><li><b>Daily calorie target.</b> Open "My daily calorie target" and enter sex, age, weight, height, activity and goal. The app shows your target and how to split it between breakfast, lunch, snack and dinner. The calculation is approximate, for adults only, and is not medical advice.</li><li><b>Daily meal plan.</b> In the same block tap "Suggest a plan" and the app picks dishes for all meals. The "Build my daily meal plan" button opens the plan screen, where you can add dishes through search, change portions with the − and + buttons, swap a dish for a similar one with ↻, remove it with ✕ and pick a new plan. At the top you see how many calories you have and how many are left.</li><li><b>Theme</b> changes the look, <b>EN / RU</b> switches the language. T const rxSw=/печенье|кекс|десерт|варень|гозинаки|чурчхела|пеламуши|пахлав|(^|\s)гата|тклапи|шарики|торт|пирожн|мармелад|чизкейк|мороженое|желе|пудинг|маффин|эклер|пончик|вафл|шоколад|сладк|запечённые яблоки|груши с|мёд с|медов|яблочный пирог|пирог с (айв|вишн|грецк)|ореховой начинкой|пирог с вишн|варенье/i,

function cand(i){return R.filter(r=>{const k=pk1(r),n=r.n;if(rxDr.test(n)||rxSa.test(n))return false;const sw=rxSw.test(n);

 $('th').textContent='\u{1F3A8}';$('th').title=$('th').ariaLabel=t('th')[theme];$('lg').textContent=lang=='en'?'\u{1F310} RU':'\u{1F310} EN';$('lg').setAttribute('aria-label',lang=='en'?'Русский':'English');$('msg').textContent=t(mk);
 $('deco').innerHTML=TH[theme].map((e,i)=>`<span style="${POS[i]}">${e}</span>`).join('');calcR()}
function add(v){let w=0;
 v.split(/[,;]+/).forEach(p=>{p=p.replace(/\d+([.,]\d+)?\s*(кг|гр?|мл|л|шт|ст\.?\s?л\.?|ч\.?\s?л\.?|kg|g|ml|l|pcs|tbsp|tsp|oz|lb)?/gi,'').trim();if(!p)return;
 const r=RV[p.toLowerCase()];if(r)p=r.toLowerCase();
 if(IG.includes(p.toLowerCase())||['salt','pepper','water'].includes(p.toLowerCase())){w=1;return}
 if(!have.some(h=>K(h)==K(p)))have.push(p)});
 mk=w?'msgIg':'msgRm';
 sv('have',have);$('in').value='';draw()}
function card(r,miss){const H=hs();const nn=norm(),pc=nn&&nn.k?`<div class="pc">\u{1F525} ${t('c_dish',Math.round(r.nu.k),Math.round(r.nu.k/nn.k*100))}</div>`:'';
 const buy=miss.length==1?`<div class="buy">${t('buy')} <b>${ti(miss[0].n)}</b> (${ea(miss[0].a)}) ${t('buy2')}</div>`:miss.length?`<div class="buy">${t('miss')} ${miss.map(x=>ti(x.n)).join(', ')}</div>`:'';
 const o=open.has(r.n),L=r.i.filter(x=>!x.ig),m=L.filter(x=>H.has(x.k)).length,cnt=have.length?`<div class="cnt${m==L.length?' full':''}">${t('match',m,L.length)}</div>`:'';
 const det=o?`<div class="det"><h4>${t('ing')}</h4><ul>${r.i.map(x=>`<li class="${x.ig||H.has(x.k)?'ok':'no'}">${ti(x.n)}: ${ea(x.a)}</li>`).join('')}</ul><h4>${t('prep')}</h4><ol>${r.s.map(s=>`<li>${s.replace(/(\d+[–-]?\d*\s?(°C|мин))/g,(a,b)=>`<span class="t">${lang=='en'?b.replace('мин','min'):b}</span>`)}</li>`).join('')}</ol><h4>${t('kb')}</h4>${nt(r)}</div>`:'';
 return `<div class="card"><div class="top"><span class="em">${r.e}</span><div style="flex:1"><b>${tn(r.n)}</b>${r.g?`<span class="tg">${t('cu')[r.cu]}</span>`:''}<span class="meta">\u{23F1} ${r.t} ${t('min')} · \u{1F525} ${Math.round(r.nu.k*100/r.nu.W)} ${t('k100')}</span></div><button class="heart" data-f="${r.n}" aria-label="${t('favL')}">${fav.includes(r.n)?'♥':'♡'}</button><button class="btn ghost arrow${o?' open':''}" data-r="${r.n}" aria-expanded="${o}" aria-label="${t('rec')}">${AR}</button></div>${cnt}${pc}${buy}${det}</div>`}
function draw(){showAll=!!view;const H=hs();stat();
 $('sep').style.display=have.length?'block':'none';$('chips').innerHTML=have.map((h,i)=>`<button class="chip" data-d="${i}" aria-label="${t('rm')} ${th(h)}">${th(h)} ✕</button>`).join('');
 $('quick').innerHTML=Q.filter(q=>!H.has(K(q))).map(q=>`<button class="q" data-q="${q}">+ ${th(q)}</button>`).join('');
 $('panel').innerHTML=(fav.length?`<div class="hint">${t('fav')}</div><div class="wrap">${fav.map(n=>`<button class="q" data-o="${n}">${tn(n)}</button>`).join('')}</div>`:'');
 const info=R.map(r=>{const L=r.i.filter(x=>!x.ig),miss=L.filter(x=>!H.has(x.k));return{r,miss,m:L.length-miss.length,t:L.length}}),srt=(a,b)=>b.m-a.m||a.miss.length-b.miss.length||b.m/b.t-a.m/a.t||a.r.t-b.r.t;
 const now=info.filter(x=>x.miss.length==0&&have.length).sort(srt),near=info.filter(x=>x.miss.length==1&&x.m>=2&&have.length).sort(srt),far=info.filter(x=>have.length&&x.m>=1&&(x.miss.length>1||(x.miss.length==1&&x.m<2))).sort(srt);
 let fh=fav.length?`<h2 id="fav">${t('fav')} (${fav.length})</h2>`+R.filter(r=>fav.includes(r.n)).map(r=>card(r,[])).join(''):'';
 let h=fh;
 if(!have.length)h=showAll?'':`<p class="hint">${t('empty')}</p>`;
 else{h+=`<h2>${t('now')} (${now.length})</h2>`+(now.map(x=>card(x.r,[])).join('')||`<p class="hint">${t('nowE')}</p>`);
 h+=`<h2>${t('near')} (${near.length})</h2>`+(near.map(x=>card(x.r,x.miss)).join('')||`<p class="hint">${t('nearE')}</p>`)+(far.length?`<h2>${t('far')} (${far.length})</h2>`+far.map(x=>card(x.r,x.miss)).join(''):'')}
 if(showAll)h=fh;
 $('sw').style.display=showAll?'block':'none';
 if(showAll){const f=sq.toLowerCase().replace(/ё/g,'е').trim(),L=info.filter(x=>!f||(x.r.n+' '+(TE[x.r.n]||'')+(x.r.g?' '+CK[x.r.cu]:'')+' '+x.r.i.map(i=>i.n+' '+(IE[i.n]||'')).join(' ')).toLowerCase().replace(/ё/g,'е').includes(f)).sort((a,b)=>have.length?srt(a,b):0);
 const B=view=='q'?L.filter(x=>x.r.t<30):view=='l'?L.filter(x=>x.r.t>=30):L,TT=view=='q'?t('qk'):view=='l'?t('lg'):t('all');h+=`<h2>${TT} (${B.length})</h2>`+(B.map(x=>card(x.r,[])).join('')||`<p class="hint">${t('none')}</p>`)}
 $('out').innerHTML=h;$('all').className='btn ghost tog arrow big2'+(view=='a'?' open on':'');$('all').setAttribute('aria-expanded',view=='a');$('vq').innerHTML=t('vq');$('vl').innerHTML=t('vl');$('vq').className='btn ghost'+(view=='q'?' on':'');$('vl').className='btn ghost'+(view=='l'?' on':'');$('all').innerHTML=`<span>${view=='a'?t('hideAll'):t('showAll')}</span>${AR}`}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.id=='th'){const k=Object.keys(TH);theme=k[(k.indexOf(theme)+1)%k.length];sv('theme',theme);draw()}
 else if(b.id=='lg'){lang=lang=='en'?'ru':'en';sv('lang',lang);draw()}
 else if(b.dataset.d!==undefined){have.splice(+b.dataset.d,1);sv('have',have);draw()}
 else if(b.dataset.f){const n=b.dataset.f;fav=fav.includes(n)?fav.filter(x=>x!=n):[...fav,n];sv('fav',fav);draw()}
 else if(b.dataset.o){open.add(b.dataset.o);draw();$('fav').scrollIntoView({behavior:'smooth'})}
 else if(b.dataset.q)add(b.dataset.q);
 else if(b.dataset.r){open.has(b.dataset.r)?open.delete(b.dataset.r):open.add(b.dataset.r);draw()}});
$('add').onclick=()=>add($('in').value);
$('in').addEventListener('keydown',e=>{if(e.key=='Enter')add(e.target.value)});
$('sr').addEventListener('input',e=>{sq=e.target.value;draw()});
$('all').onclick=()=>{view=view=='a'?'':'a';draw()};$('vq').onclick=()=>{view=view=='q'?'':'q';draw()};$('vl').onclick=()=>{view=view=='l'?'':'l';draw()};
draw();
const upB=$('up');
function upChk(){upB.classList.toggle('on',(window.pageYOffset||document.documentElement.scrollTop||0)>500)}
window.addEventListener('scroll',upChk,{passive:true});
upB.onclick=()=>{try{window.scrollTo({top:0,behavior:'smooth'})}catch(e){window.scrollTo(0,0)}};
upChk();

const ovStack=[];let skipPop=0;
function oOpen(id){const e=$(id);e.hidden=false;e.scrollTop=0;ovStack.push(id);document.body.style.overflow='hidden';document.body.classList.add('ovo');try{history.pushState({ov:1},'')}catch(x){}}
function oClose(){const id=ovStack.pop();if(!id)return;$(id).hidden=true;if(!ovStack.length){document.body.style.overflow='';document.body.classList.remove('ovo')}try{if(history.state&&history.state.ov){skipPop++;history.back()}}catch(x){}}
$('how_t').onclick=()=>oOpen('ov');$('ov_b').onclick=oClose;$('pl_b').onclick=oClose;$('pk_b').onclick=oClose;
window.addEventListener('popstate',()=>{if(skipPop>0){skipPop--;return}const id=ovStack.pop();if(id){$(id).hidden=true;if(!ovStack.length){document.body.style.overflow='';document.body.classList.remove('ovo')}}});
document.addEventListener('keydown',e=>{if(e.key=='Escape')oClose()});
$('c_res').addEventListener('click',e=>{if(!e.target.closest)return;if(e.target.closest('#plb2'))plOpen(true);else if(e.target.closest('#plb'))plOpen()});
$('pl_c').addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('button');if(!b)return;const a=b.dataset.a,m=+b.dataset.m,j=+b.dataset.j;
 if(a=='pick'){plPick(m);return}
 if(a=='auto')plAuto();else if(a=='clear')pl={m:[[],[],[],[]]};
 else if(a=='inc'&&pl.m[m]&&pl.m[m][j])pl.m[m][j].p=Math.min(4,pl.m[m][j].p+.5);
 else if(a=='dec'&&pl.m[m]&&pl.m[m][j])pl.m[m][j].p=Math.max(.5,pl.m[m][j].p-.5);
 else if(a=='del'&&pl.m[m])pl.m[m].splice(j,1);
 else if(a=='swap'&&pl.m[m]&&pl.m[m][j]){const n=norm(),T=n.k*MS[m],used=new Set(pl.m.flat().map(x=>x.n));
  const c=cand(m).filter(r=>!used.has(r.n)&&pk1(r)>=T*.4&&pk1(r)<=T*2.2).map(r=>({r,d:Math.abs(pk1(r)-T)/T+Math.random()*.4})).sort((a,b)=>a.d-b.d).slice(0,5);
  if(c.length){const r=c[Math.floor(Math.random()*c.length)].r;pl.m[m][j]={n:r.n,p:Math.min(2,Math.max(.5,Math.round(T/pk1(r)*4)/4))}}}
 sv('plan',pl);plR()});
$('pk_q').addEventListener('input',pkR);
$('pk_l').addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('button');if(!b)return;const r=R[+b.dataset.i],n=norm();if(!r||!n||!n.k)return;
 pl.m[pkM].push({n:r.n,p:Math.min(2,Math.max(.5,Math.round(n.k*MS[pkM]/pk1(r)*2)/2))});sv('plan',pl);plR();oClose()});
